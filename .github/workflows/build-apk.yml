name: Build Flutter APK

on:
  push:
    branches:
      - build-apk

env:
  FLUTTER_VERSION: 3.41.2
  VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v3

      # 2️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4️⃣ Build APK (split per ABI for smaller size, auto versioning)
      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --build-number=${{ env.VERSION_CODE }}

      # 5️⃣ Upload APKs as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: build/app/outputs/flutter-apk/*.apk